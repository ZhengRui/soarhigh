name: soarhigh-hermes

services:
  wechat-gateway:
    build:
      context: .
      dockerfile: wechat_gateway/Dockerfile
    restart: unless-stopped
    environment:
      WECHAT_GATEWAY_SERVICE_TOKEN: "${WECHAT_GATEWAY_SERVICE_TOKEN:?Set WECHAT_GATEWAY_SERVICE_TOKEN in .env.local}"
      WECHAT_OFFICIAL_ACCOUNT_APP_ID: "${WECHAT_OFFICIAL_ACCOUNT_APP_ID:?Set WECHAT_OFFICIAL_ACCOUNT_APP_ID in .env.local}"
      WECHAT_OFFICIAL_ACCOUNT_APP_SECRET: "${WECHAT_OFFICIAL_ACCOUNT_APP_SECRET:?Set WECHAT_OFFICIAL_ACCOUNT_APP_SECRET in .env.local}"
      WECHAT_ASSET_BASE_URL: "${WECHAT_ASSET_BASE_URL:?Set WECHAT_ASSET_BASE_URL in .env.local}"
    ports:
      - "127.0.0.1:${WECHAT_GATEWAY_PORT:-8790}:8790"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/healthz', timeout=2).read()"
      interval: 30s
      timeout: 3s
      retries: 3

  gateway:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    container_name: ${HERMES_CONTAINER_NAME:-soarhigh-hermes}
    restart: unless-stopped
    working_dir: /workspace
    command: ["/opt/soarhigh/run_gateway.sh"]
    environment:
      HERMES_UID: "${HERMES_UID:-10000}"
      HERMES_GID: "${HERMES_GID:-10000}"
      SOARHIGH_API_BASE_URL: "${SOARHIGH_API_BASE_URL:-http://host.docker.internal:5000}"
      WXPOST_PREVIEW_BROWSER_BASE_URL: "${WXPOST_PREVIEW_BROWSER_BASE_URL:-http://host.docker.internal:3000}"
      WXPOST_SERVICE_TOKEN: "${SOARHIGH_WXPOST_SERVICE_TOKEN:?Set SOARHIGH_WXPOST_SERVICE_TOKEN in .env.local}"
      HERMES_DASHBOARD_SESSION_TOKEN: "${SOARHIGH_WXPOST_SERVICE_TOKEN:?Set SOARHIGH_WXPOST_SERVICE_TOKEN in .env.local}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      PYTHONPATH: /opt/soarhigh
      WXPOST_UPLOAD_CACHE_ROOTS: /opt/data/profiles/wxpost/cache
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - type: bind
        source: ${HERMES_HOME_DIR:?Set HERMES_HOME_DIR in .env.local}
        target: /opt/data
        bind:
          create_host_path: false
      - type: bind
        source: ${HERMES_WORKSPACE_DIR:?Set HERMES_WORKSPACE_DIR in .env.local}
        target: /workspace
        bind:
          create_host_path: false
      - type: bind
        source: ./wxpost_controller
        target: /opt/soarhigh/wxpost_controller
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./skills/soarhigh-wxpost-authoring
        target: /opt/soarhigh/skills/soarhigh-wxpost-authoring
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./wxpost_profile
        target: /opt/soarhigh/wxpost_profile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./run_gateway.sh
        target: /opt/soarhigh/run_gateway.sh
        read_only: true
        bind:
          create_host_path: false

  controller:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    restart: unless-stopped
    working_dir: /workspace
    command:
      - /opt/hermes/.venv/bin/python
      - -m
      - wxpost_controller.http_server
      - --host
      - 0.0.0.0
      - --port
      - "8787"
    environment:
      HERMES_UID: "${HERMES_UID:-10000}"
      HERMES_GID: "${HERMES_GID:-10000}"
      PYTHONPATH: /opt/soarhigh
      SOARHIGH_API_BASE_URL: "${SOARHIGH_API_BASE_URL:-http://host.docker.internal:5000}"
      WXPOST_SERVICE_TOKEN: "${SOARHIGH_WXPOST_SERVICE_TOKEN:?Set SOARHIGH_WXPOST_SERVICE_TOKEN in .env.local}"
      WXPOST_WORKSPACE_ROOT: /workspace
      HERMES_HOME: /opt/data/profiles/wxpost
      HERMES_SERVE_URL: ws://127.0.0.1:9119/api/ws
    network_mode: service:gateway
    depends_on:
      - gateway
    volumes:
      - type: bind
        source: ${HERMES_HOME_DIR:?Set HERMES_HOME_DIR in .env.local}
        target: /opt/data
        bind:
          create_host_path: false
      - type: bind
        source: ${HERMES_WORKSPACE_DIR:?Set HERMES_WORKSPACE_DIR in .env.local}
        target: /workspace
        bind:
          create_host_path: false
      - type: bind
        source: ./wxpost_controller
        target: /opt/soarhigh/wxpost_controller
        read_only: true
        bind:
          create_host_path: false
